[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-incident-copilot"
version = "0.3.0"
description = "A local Kubernetes incident diagnosis assistant with retrieval and a LangGraph agent."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anyio>=4,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-core>=1.4.7,<2",
    "langgraph>=1.2.20,<1.3",
    "langsmith>=0.14.9,<1",
    "pydantic>=2.11,<3",
    "typing-extensions>=4.12,<5",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
k8s_incident_copilot = ["knowledge/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
