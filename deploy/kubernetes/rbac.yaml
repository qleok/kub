apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-incident-copilot
  namespace: incident-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-incident-copilot
  namespace: incident-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-incident-copilot
  namespace: incident-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-incident-copilot
subjects:
  - kind: ServiceAccount
    name: k8s-incident-copilot
    namespace: incident-demo
